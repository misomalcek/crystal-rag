name: windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Qdrant, the embed server, and the model
        shell: pwsh
        run: |
          $rt = "src-tauri/resources/embed-runtime"
          $models = "src-tauri/resources/models"
          New-Item -ItemType Directory -Force -Path $rt, $models | Out-Null
          Invoke-WebRequest "https://github.com/qdrant/qdrant/releases/download/v1.18.1/qdrant-x86_64-pc-windows-msvc.zip" -OutFile qdrant.zip
          Expand-Archive qdrant.zip -DestinationPath qdrant-win
          Copy-Item (Get-ChildItem -Recurse qdrant-win -Filter qdrant.exe | Select-Object -First 1).FullName "$rt/qdrant.exe"
          curl.exe -L -o llama.zip "https://github.com/ggml-org/llama.cpp/releases/download/b11669/llama-b11669-bin-win-cpu-x64.zip"
          Expand-Archive llama.zip -DestinationPath llama-win
          Get-ChildItem llama-win -Recurse -File | Copy-Item -Destination $rt -Force
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $crt = $null
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($redist) {
            $try = Join-Path $redist.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $try) { $crt = $try }
          }
          if (-not $crt) {
            $dll = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\Hostx64\\x64\\vcruntime140\.dll$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($dll) { $crt = $dll.DirectoryName }
          }
          if (-not $crt) { throw "Visual C++ runtime not found under $vs" }
          Get-ChildItem $crt -Filter *.dll | Copy-Item -Destination $rt -Force
          foreach ($n in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")) {
            if (-not (Test-Path (Join-Path $rt $n))) { throw "missing $n next to the engines" }
          }
          curl.exe -L -o "$models/nomic-embed-text-v1.5.Q4_K_M.gguf" "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          Get-ChildItem $rt | Select-Object Name, Length
          Get-Item "$models/nomic-embed-text-v1.5.Q4_K_M.gguf" | Select-Object Name, Length
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        with:
          name: crystal-rag-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
