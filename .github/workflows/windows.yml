name: windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Qdrant, the embed server, and the model
        shell: pwsh
        run: |
          $rt = "src-tauri/resources/embed-runtime"
          $models = "src-tauri/resources/models"
          New-Item -ItemType Directory -Force -Path $rt, $models | Out-Null
          Invoke-WebRequest "https://github.com/qdrant/qdrant/releases/download/v1.18.1/qdrant-x86_64-pc-windows-msvc.zip" -OutFile qdrant.zip
          Expand-Archive qdrant.zip -DestinationPath qdrant-win
          Copy-Item (Get-ChildItem -Recurse qdrant-win -Filter qdrant.exe | Select-Object -First 1).FullName "$rt/qdrant.exe"
          curl.exe -L -o llama.zip "https://github.com/ggml-org/llama.cpp/releases/download/b11669/llama-b11669-bin-win-cpu-x64.zip"
          Expand-Archive llama.zip -DestinationPath llama-win
          Get-ChildItem llama-win -Recurse -File | Copy-Item -Destination $rt -Force
          curl.exe -L -o "$models/nomic-embed-text-v1.5.Q4_K_M.gguf" "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          Get-ChildItem $rt | Select-Object Name, Length
          Get-Item "$models/nomic-embed-text-v1.5.Q4_K_M.gguf" | Select-Object Name, Length
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-rag-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
